name: Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  # GG-C2: mandatory test gate. release.yml previously built & published
  # installers on a tag push with NO test run (ci.yml keys on branch pushes, not
  # tags), so the full test suite was bypassed at exactly the moment it matters.
  # This job runs the whole suite (after the same Ollama-binary fetch CI does) and
  # every build job `needs:` it, so a red suite aborts the release before any
  # artifact is produced or uploaded.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy, llvm-tools-preview

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Fetch Ollama binaries
        run: bash scripts/fetch-ollama-binaries.sh

      - name: Cargo fmt check
        working-directory: ./src-tauri
        run: cargo fmt --check

      - name: Cargo clippy
        working-directory: ./src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Cargo test (full)
        working-directory: ./src-tauri
        run: cargo test --all --locked

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Rust coverage gate
        working-directory: ./src-tauri
        run: |
          mkdir -p ../coverage
          cargo llvm-cov --lib --lcov --output-path ../coverage/rust.lcov --fail-under-regions 68 --fail-under-functions 60 --fail-under-lines 72

      - name: Setup Node.js for tests
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Vitest coverage gate
        run: npm run test:coverage

      - name: Preserve coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: release-coverage-reports
          path: coverage/

  hosted-release-evidence:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The evidence intentionally points at the merged-code preflight
          # commit, which is an ancestor of the final evidence/tag commit.
          # A depth-1 tag checkout cannot prove that ancestry.
          fetch-depth: 0

      - name: Setup Node.js for evidence gate
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Require exact-tag local RC and cleanroom evidence
        run: node scripts/verify-hosted-release-evidence.mjs "${{ github.ref_name }}"

  windows-build:
    needs: hosted-release-evidence
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch Ollama binaries
        run: bash scripts/fetch-ollama-binaries.sh

      - name: Azure token preflight (fail-fast)
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          $body = @{
            client_id = $env:AZURE_CLIENT_ID
            client_secret = $env:AZURE_CLIENT_SECRET
            grant_type = "client_credentials"
            scope = "https://management.azure.com/.default"
          }
          $uri = "https://login.microsoftonline.com/$env:AZURE_TENANT_ID/oauth2/v2.0/token"
          try {
            Invoke-RestMethod -Method Post -Uri $uri -Body $body -ErrorAction Stop | Out-Null
            Write-Host "Azure token preflight succeeded."
          } catch {
            throw "Azure token preflight failed: $($_.Exception.Message)"
          }

      - name: Install pinned Artifact Signing module
        shell: powershell
        run: |
          Install-Module -Name ArtifactSigning -RequiredVersion 0.1.8 -Scope CurrentUser -Force -Repository PSGallery
          "$env:GITHUB_WORKSPACE\scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build native signing shim
        shell: powershell
        run: |
          $source = Get-Content -Raw "$env:GITHUB_WORKSPACE\scripts\sign-windows-shim.cs"
          $output = Join-Path $env:RUNNER_TEMP "civic-sign-shim.exe"
          Add-Type -TypeDefinition $source -OutputAssembly $output -OutputType ConsoleApplication
          $env:RUNNER_TEMP | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build and sign Windows NSIS installer
        uses: tauri-apps/tauri-action@v0
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          # GG-C2: --locked is passed through Tauri to Cargo after `--`, forcing
          # the build to use the committed Cargo.lock so a drifting transitive
          # dependency can't enter a release that CI never saw.
          args: --config src-tauri/tauri.windows-signing.conf.json --target x86_64-pc-windows-msvc --bundles nsis -- --locked

      - name: Dump signing diagnostics
        if: failure()
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "civicnewspaper-signing.log"
          if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log } else { Write-Host "Signer did not create a diagnostic log." }

      - name: Locate the NSIS installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath "src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis" -Filter "*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer; found $($installers.Count)."
          }
          "INSTALLER_PATH=$($installers[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify installer, application, and uninstaller signatures (fail-closed)
        shell: pwsh
        run: |
          ./scripts/verify-windows-signatures.ps1 -Installer $env:INSTALLER_PATH -ReceiptPath release-signature-receipt.json

      - name: Stage signed Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $version = "${{ github.ref_name }}".TrimStart("v")
          $destination = Join-Path (Resolve-Path release-assets) "The.Civic.Desk_${version}_x64-setup.exe"
          Copy-Item -LiteralPath $env:INSTALLER_PATH -Destination $destination
          $receipt = Get-Content -Raw -LiteralPath release-signature-receipt.json | ConvertFrom-Json
          $receipt | Add-Member -NotePropertyName release_asset_name -NotePropertyValue (Split-Path -Leaf $destination) -Force
          $receipt | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath windows-signature-smoke-receipt.json -Encoding utf8
          "STAGED_INSTALLER=$destination" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Preserve release signature proof
        uses: actions/upload-artifact@v4
        with:
          name: release-signature-proof-${{ github.sha }}
          path: windows-signature-smoke-receipt.json
          if-no-files-found: error

      - name: Verify release artifacts
        env:
          ARTIFACT_DIR: release-assets
          RELEASE_VERIFY_REQUIRED_EXTS: .exe
        run: |
          bash scripts/verify-release.sh

      - name: Upload signed Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ github.sha }}
          path: |
            ${{ env.STAGED_INSTALLER }}
            windows-signature-smoke-receipt.json
          if-no-files-found: error

  macos-build:
    needs: hosted-release-evidence
    # GitHub's macos-15 standard runner is arm64. Pin the image so the release
    # smoke actually launches the ARM64 app instead of merely cross-compiling it.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Apple Silicon Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          targets: aarch64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build unsigned Apple Silicon DMG
        run: npm run tauri build -- --config src-tauri/tauri.macos.conf.json --target aarch64-apple-darwin --bundles dmg -- --locked

      - name: Verify Apple Silicon bundle and stage DMG
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="src-tauri/target/aarch64-apple-darwin/release/bundle"
          shopt -s nullglob
          dmgs=( "$bundle_root"/dmg/*.dmg )
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "FAIL: expected exactly one Apple Silicon DMG; found ${#dmgs[@]}"
            exit 1
          fi
          mount_dir="$(mktemp -d "${RUNNER_TEMP}/civicdesk-dmg.XXXXXX")"
          cleanup() {
            hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            rmdir "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          hdiutil attach "${dmgs[0]}" -readonly -nobrowse -mountpoint "$mount_dir" >/dev/null
          app="$mount_dir/The Civic Desk.app"
          binary="$app/Contents/MacOS/civicnews"
          if [ ! -x "$binary" ]; then
            echo "FAIL: packaged macOS executable is missing: $binary"
            exit 1
          fi
          arches="$(lipo -archs "$binary")"
          if [ "$arches" != "arm64" ]; then
            echo "FAIL: expected arm64-only executable; found: $arches"
            exit 1
          fi
          if find "$app/Contents/Resources" -type f -name manifest.json | grep -q .; then
            echo "Browser extension manifest is bundled."
          else
            echo "FAIL: browser extension manifest is missing from the app bundle."
            exit 1
          fi
          if find "$app/Contents/Resources" -type f -path '*/prompts/*' | grep -q .; then
            echo "Prompt resources are bundled."
          else
            echo "FAIL: prompt resources are missing from the app bundle."
            exit 1
          fi
          codesign -dvv "$app" 2>&1 | tee macos-codesign-inspection.txt || true
          if grep -q 'Authority=Developer ID Application' macos-codesign-inspection.txt; then
            echo "FAIL: the unsigned beta unexpectedly carries a Developer ID identity."
            exit 1
          fi
          mkdir -p release-assets
          version="${GITHUB_REF_NAME#v}"
          staged="$PWD/release-assets/The.Civic.Desk_${version}_aarch64.dmg"
          cp "${dmgs[0]}" "$staged"
          echo "STAGED_DMG=$staged" >> "$GITHUB_ENV"

      - name: Verify macOS release artifact
        env:
          ARTIFACT_DIR: release-assets
          RELEASE_VERIFY_REQUIRED_EXTS: .dmg
        run: bash scripts/verify-release.sh

      - name: Smoke-test the exact hosted DMG on a fresh Mac runner
        run: |
          node scripts/macos-packaged-smoke.mjs "$STAGED_DMG" \
            --receipt "$PWD/macos-packaged-smoke-receipt.json"

      - name: Upload Apple Silicon release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ github.sha }}
          path: |
            ${{ env.STAGED_DMG }}
            macos-packaged-smoke-receipt.json
          if-no-files-found: error

      - name: Preserve macOS architecture and signing inspection
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-inspection-${{ github.sha }}
          path: macos-codesign-inspection.txt
          if-no-files-found: error

  linux-build:
    needs: hosted-release-evidence
    # Build against Ubuntu 22.04, the declared baseline for the x86_64 DEB.
    # The smoke installs this exact package on the fresh runner and launches it
    # with an isolated profile and Ollama deliberately unreachable.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux packaging and smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev xvfb

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          targets: x86_64-unknown-linux-gnu

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch Ollama binaries
        run: bash scripts/fetch-ollama-binaries.sh

      - name: Build x86_64 Debian package
        run: npm run tauri build -- --config src-tauri/tauri.linux.conf.json --target x86_64-unknown-linux-gnu --bundles deb -- --locked

      - name: Stage Debian package
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb"
          shopt -s nullglob
          debs=( "$bundle_root"/*.deb )
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "FAIL: expected exactly one Debian package; found ${#debs[@]}"
            exit 1
          fi
          mkdir -p release-assets
          version="${GITHUB_REF_NAME#v}"
          staged="$PWD/release-assets/The.Civic.Desk_${version}_amd64.deb"
          cp "${debs[0]}" "$staged"
          echo "STAGED_DEB=$staged" >> "$GITHUB_ENV"

      - name: Verify Linux release artifact
        env:
          ARTIFACT_DIR: release-assets
          RELEASE_VERIFY_REQUIRED_EXTS: .deb
        run: bash scripts/verify-release.sh

      - name: Smoke-test the exact staged DEB on a fresh Ubuntu runner
        run: |
          node scripts/linux-packaged-smoke.mjs "$STAGED_DEB" \
            --receipt "$PWD/linux-packaged-smoke-receipt.json"

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ github.sha }}
          path: |
            ${{ env.STAGED_DEB }}
            linux-packaged-smoke-receipt.json
          if-no-files-found: error

  publish-release:
    needs:
      - windows-build
      - macos-build
      - linux-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download verified release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows-${{ github.sha }}
          path: release-staging/windows

      - name: Download verified macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: release-macos-${{ github.sha }}
          path: release-staging/macos

      - name: Download verified Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: release-linux-${{ github.sha }}
          path: release-staging/linux

      - name: Require one Windows installer, Apple Silicon DMG, and x86_64 DEB
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find release-staging/windows -type f \( -name '*.exe' -o -name 'windows-signature-smoke-receipt.json' \) \
            -exec cp '{}' release-assets/ \;
          find release-staging/macos -type f \( -name '*.dmg' -o -name 'macos-packaged-smoke-receipt.json' \) \
            -exec cp '{}' release-assets/ \;
          find release-staging/linux -type f \( -name '*.deb' -o -name 'linux-packaged-smoke-receipt.json' \) \
            -exec cp '{}' release-assets/ \;
          test "$(find release-assets -maxdepth 1 -type f -name '*.exe' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.dmg' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 1
          test -f release-assets/windows-signature-smoke-receipt.json
          test -f release-assets/macos-packaged-smoke-receipt.json
          test -f release-assets/linux-packaged-smoke-receipt.json
          ARTIFACT_DIR=release-assets RELEASE_VERIFY_REQUIRED_EXTS=".exe .dmg .deb" bash scripts/verify-release.sh

      - name: Create draft prerelease and upload verified artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --draft \
              --prerelease \
              --title "The Civic Desk ${{ github.ref_name }}" \
              --notes "DRAFT public beta for signed Windows x64, unsigned Apple Silicon macOS, and Debian/Ubuntu x86_64 Linux. macOS is not Developer ID signed or notarized; macOS and Linux require a separately installed Ollama app. Do not publish until SHA256SUMS, platform-specific packaged-smoke receipts, Windows signature proof, and exact-tag release evidence have been reviewed."
          fi
          gh release upload "${{ github.ref_name }}" release-assets/* \
            --repo "${{ github.repository }}" \
            --clobber

  # After both platform builds are uploaded, aggregate a single
  # SHA256SUMS manifest covering all published assets and attach it to the release.
  # This is the manifest docs/install.md, README.md, and FAQ.md tell users to verify
  # against; without this job it 404s and installer provenance checks are incomplete.
  checksums:
    needs: publish-release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all published release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --dir release-assets

      - name: Generate combined SHA256SUMS
        run: |
          : > SHA256SUMS
          while IFS= read -r f; do
            ( cd release-assets && sha256sum "$f" ) >> SHA256SUMS
          done < <(find release-assets -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%P\n' | sort)
          if [ ! -s SHA256SUMS ]; then
            echo "FAIL: no release assets were found to checksum"
            exit 1
          fi
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      - name: Upload SHA256SUMS to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" SHA256SUMS \
            --repo "${{ github.repository }}" --clobber

      - name: Release-integrity gate (manifest present + every listed artifact published)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/verify-release-assets.sh "${{ github.ref_name }}"
